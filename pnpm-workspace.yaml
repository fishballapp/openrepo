  - packages/plugin-git
  - packages/plugin-local-leaks
  - packages/plugin-pnpm
  - packages/plugin-secretlint
  - packages/plugin-typescript
autoInstallPeers: true
strictPeerDependencies: false
minimumReleaseAge: 10080
