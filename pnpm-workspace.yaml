  "@secretlint/core": 13.0.6
  "@secretlint/secretlint-rule-preset-recommend": 13.0.6
  "@secretlint/types": 13.0.6
  "@stricli/core": ^1.3.0
  "@types/node": ^24.13.4
  jsonc-parser: ^3.3.1
  repojj: ^2026.7.29
  tsdown: ^0.23.0
  typescript: ~7.0.2
  vitest: ^5.0.1
  yaml: ^2.9.1
  zod: ^4.6.7
